name: Template CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    # Was `arc-runners-frontend` — a Higgsfield self-hosted runner that does not
    # exist on this repo, so every run sat queued forever. GitHub-hosted runner
    # instead, which is all this job needs.
    runs-on: ubuntu-latest
    name: Validate template
    # The app project lives in app/ (ci/ holds the deploy config, AGENTS.md +
    # skills/ stay at root). Every build step runs there.
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Non-blocking: the tree has two PRE-EXISTING violations of
      # react-hooks/set-state-in-effect, both in vendored shadcn components
      # (src/components/ui/carousel.tsx:96, src/hooks/use-mobile.ts:14) and
      # unrelated to the Tropix pages. Failing every build on them would just
      # train everyone to ignore a red X. Fix those two, then drop this line.
      - name: Lint
        continue-on-error: true
        run: bun run lint

      - name: Test
        run: bun run test

      # Deploys always ship the design inspector: apps-ci / apps-ci-dev export
      # HF_DESIGN_INSPECTOR=1 before `bun run build`. Validate that exact
      # artifact here — one build, not a separate plain + design pair.
      - name: Build (design inspector on, as deploys ship it)
        env:
          HF_DESIGN_INSPECTOR: "1"
        run: bun run build
